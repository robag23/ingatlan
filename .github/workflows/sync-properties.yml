name: Ingatlanok automatikus frissítése

on:
  push:
    branches:
      - main
    paths:
      - "data/active.txt"
      - "data/sold.txt"
      - "scripts/sync_properties.py"
      - ".github/workflows/sync-properties.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: property-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ingatlanok beolvasása
        run: python scripts/sync_properties.py

      - name: Változások mentése
        run: |
          git config user.name "Sziget-Baracsi Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add data/properties.json assets/images/
          if git diff --cached --quiet; then
            echo "Nincs mentendő változás."
          else
            git commit -m "Automatikus ingatlan frissítés"
            git push
          fi
